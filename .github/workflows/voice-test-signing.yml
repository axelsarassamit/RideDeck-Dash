name: Sign voice integration test build
on:
  push:
    branches: [main]
    paths: [signing-requests/voice-test.json]
permissions:
  contents: read
jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate test build version
        run: |
          python3 - <<'PY'
          import json,re,os
          version=json.load(open('signing-requests/voice-test.json'))['version']
          assert re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+',version)
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('DASH_VERSION_NAME='+version+'\n')
          PY
      - name: Build with permanent Dash signer
        env:
          KEYSTORE: ${{ secrets.DASH_KEYSTORE_BASE64 }}
          DASH_KEYSTORE_PASSWORD: ${{ secrets.DASH_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE"
          export DASH_KEYSTORE_PATH="$RUNNER_TEMP/dash-release.p12"
          trap 'rm -f "$DASH_KEYSTORE_PATH"' EXIT
          printf '%s' "$KEYSTORE" | base64 --decode > "$DASH_KEYSTORE_PATH"
          bash gradlew testDebugUnitTest lintRelease assembleRelease assembleReleaseAndroidTest -PphoneTestVariant=release --no-daemon
          mkdir dist
          cp app/build/outputs/apk/release/app-release.apk dist/ridedeck-dash-release.apk
          cp app/build/outputs/apk/androidTest/release/app-release-androidTest.apk dist/dash-voice-test.apk
          printf 'repository=%s\ncommit=%s\nversion=%s\nstatus=voice-integration-test\n' "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$DASH_VERSION_NAME" > dist/source.txt
          cd dist
          sha256sum *.apk > checksums.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ridedeck-dash-voice-test-signed
          path: dist/*
