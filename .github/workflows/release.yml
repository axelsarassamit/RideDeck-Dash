name: Signed release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
concurrency:
  group: dash-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager "build-tools;36.0.0" "platforms;android-36"
      - name: Prepare permanent signer
        env:
          KEYSTORE: ${{ secrets.DASH_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE"
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/dash-release.p12"
      - name: Build and verify release
        env:
          DASH_VERSION_NAME: ${{ github.ref_name }}
          DASH_KEYSTORE_PATH: ${{ runner.temp }}/dash-release.p12
          DASH_KEYSTORE_PASSWORD: ${{ secrets.DASH_KEYSTORE_PASSWORD }}
        run: |
          bash gradlew :app:testDebugUnitTest :app:lintRelease :app:assembleRelease --no-daemon
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/ridedeck-dash-release.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs dist/ridedeck-dash-release.apk
          cd dist
          sha256sum ridedeck-dash-release.apk > checksums.txt
          printf 'repository=%s\ncommit=%s\ntag=%s\nstatus=development-dashcam\n' "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$GITHUB_REF_NAME" > source.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ridedeck-dash-signed-${{ github.ref_name }}
          path: dist/*
      - name: Publish development release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --prerelease --title "RideDeck Dash $GITHUB_REF_NAME" --notes-file docs/RELEASE_NOTES.md
      - name: Remove temporary signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/dash-release.p12"
